TS</text><text class="lbl" x="594" y="130" fill="#ffd84d" filter="url(#glow)">[+]</text><text class="lbl" x="624" y="130" fill="#2f8f45">LEARNING</text><text class="sm" x="624" y="147" fill="#00FF00">Advanced C# &amp; Game Design Patterns</text><text class="lbl" x="594" y="172" fill="#ffd84d" filter="url(#glow)">[&amp;]</text><text class="lbl" x="624" y="172" fill="#2f8f45">SEEKING PARTY</text><text class="sm" x="624" y="189" fill="#00FF00">Open source C# projects &amp; beginner</text><text class="sm" x="624" y="205" fill="#00FF00">game jams</text><text class="lbl" x="594" y="230" fill="#ffd84d" filter="url(#glow)">[?]</text><text class="lbl" x="624" y="230" fill="#2f8f45">ASK ME ABOUT</text><text class="sm" x="624" y="247" fill="#00FF00">C# logic, state machines &amp; console UI</text><text class="sm" x="624" y="263" fill="#00FF00">systems</text><text class="lbl" x="594" y="288" fill="#ffd84d" filter="url(#glow)">[!]</text><text class="lbl" x="624" y="288" fill="#2f8f45">FUN FACT</text><text class="sm" x="624" y="305" fill="#00FF00">I build complex financial software</text><text class="sm" x="624" y="321" fill="#00FF00">just to master logic systems</text><rect x="40" y="362" width="880" height="104" rx="4" fill="#001a06" stroke="#00a83a" stroke-opacity=".7"/><text class="lbl" x="54" y="384" fill="#2f8f45">EQUIPPED GEAR &amp; SKILLS</text><text class="lbl" x="54" y="417" fill="#2f8f45">GEAR</text><rect x="118" y="402" width="38" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="137" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">C#</text><rect x="164" y="402" width="190" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="259" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">Python (fundamentals)</text><rect x="362" y="402" width="78" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="401" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">.NET 10</text><rect x="448" y="402" width="46" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="471" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">WPF</text><rect x="502" y="402" width="86" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="545" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">MonoGame</text><rect x="596" y="402" width="62" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="627" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">Unity</text><rect x="666" y="402" width="126" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="729" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">Visual Studio</text><rect x="800" y="402" width="46" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="823" y="417" fill="#00FF00" text-anchor="middle" filter="url(#glow)">Git</text><text class="lbl" x="54" y="447" fill="#2f8f45">SKILLS</text><rect x="118" y="432" width="174" height="22" rx="3" fill="#000" stroke="#00a83a" stroke-opacity=".9"/><text class="sm" x="205" y="447" fill="#00a83a" text-anchor="middle">System Architecture</text><rect x="300" y="432" width="102" height="22" rx="3" fill="#000" stroke="#00a83a" stroke-opacity=".9"/><text class="sm" x="351" y="447" fill="#00a83a" text-anchor="middle">Strict OOP</text><rect x="410" y="432" width="134" height="22" rx="3" fill="#000" stroke="#00a83a" stroke-opacity=".9"/><text class="sm" x="477" y="447" fill="#00a83a" text-anchor="middle">State Machines</text><rect x="552" y="432" width="174" height="22" rx="3" fill="#000" stroke="#00a83a" stroke-opacity=".9"/><text class="sm" x="639" y="447" fill="#00a83a" text-anchor="middle">Decoupled Rendering</text><rect x="734" y="432" width="158" height="22" rx="3" fill="#000" stroke="#00a83a" stroke-opac