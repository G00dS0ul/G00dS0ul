#00FF00">game jams</text><text class="lbl" x="594" y="194" fill="#ffd84d" filter="url(#glow)">[?]</text><text class="lbl" x="624" y="194" fill="#2f8f45">ASK ME ABOUT</text><text class="sm" x="624" y="211" fill="#00FF00">C# logic, state machines &amp; console UI</text><text class="sm" x="624" y="227" fill="#00FF00">systems</text><text class="lbl" x="594" y="252" fill="#ffd84d" filter="url(#glow)">[!]</text><text class="lbl" x="624" y="252" fill="#2f8f45">FUN FACT</text><text class="sm" x="624" y="269" fill="#00FF00">I build complex financial software</text><text class="sm" x="624" y="285" fill="#00FF00">just to master logic systems</text><rect x="40" y="326" width="880" height="104" rx="4" fill="#001a06" stroke="#00a83a" stroke-opacity=".7"/><text class="lbl" x="54" y="348" fill="#2f8f45">EQUIPPED GEAR &amp; SKILLS</text><text class="lbl" x="54" y="381" fill="#2f8f45">GEAR</text><rect x="118" y="366" width="38" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="137" y="381" fill="#00FF00" text-anchor="middle" filter="url(#glow)">C#</text><rect x="164" y="366" width="190" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="259" y="381" fill="#00FF00" text-anchor="middle" filter="url(#glow)">Python (fundamentals)</text><rect x="362" y="366" width="78" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="401" y="381" fill="#00FF00" text-anchor="middle" filter="url(#glow)">.NET 10</text><rect x="448" y="366" width="46" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="471" y="381" fill="#00FF00" text-anchor="middle" filter="url(#glow)">WPF</text><rect x="502" y="366" width="86" height="22" rx="3" fill="#000" stroke="#00FF00" stroke-opacity=".9"/><text class="sm" x="545" y="381" fill="#00FF00" text-anchor="middle" filter="url(#glow)">MonoGame</text><rect x="596" y="366" width="62" height="22" rx="3" fill="#000" stroke="#00FF