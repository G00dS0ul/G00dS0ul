<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00FF00" stroke-opacity=".07"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".3"/></pattern>
</defs>
<style>
  text{font-family:"Courier New",Consolas,"DejaVu Sans Mono",monospace;font-weight:700;white-space:pre}
  .ui{font-size:15px} .lbl{font-size:12px} .sm{font-size:13px} .big{font-size:20px} .xl{font-size:22px}
  .flick{animation:f 7s infinite} @keyframes f{0%,95%,100%{opacity:1}96%{opacity:.6}97%{opacity:1} }
  .pulse{animation:p 1.6s ease-in-out infinite} @keyframes p{0%,100%{opacity:.35}50%{opacity:1} }
  .blink{animation:b 1s step-end infinite} @keyframes b{50%{opacity:0} }
</style>
<rect width="480" height="160" fill="#000"/>
<rect x="0" width="468" height="160" fill="url(#grid)"/><g class="flick" filter="url(#glow)" pointer-events="none"><rect x="464.5" y="0" width="3" height="160" fill="#00FF00"/></g>
<rect x="16" y="10" width="424" height="136" rx="5" fill="#001a06" stroke="#00a83a" stroke-opacity=".8"/><text class="lbl" x="32" y="34" fill="#2f8f45">◆ QUEST 06</text><g opacity=".7"><rect x="217" y="64" width="22" height="18" fill="none" stroke="#2f8f45" stroke-width="2"/><path d="M222 64 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#2f8f45" stroke-width="2"/></g><text class="sm" x="228" y="104" fill="#2f8f45" text-anchor="middle">??? LOCKED QUEST — pin a repo to unlock</text><rect width="480" height="160" fill="url(#scan)" pointer-events="none"/>
</svg>
